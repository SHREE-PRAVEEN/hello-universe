services:
  - type: web
    name: hello-universe-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hello-universe-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://hellouniverse.roboveda.tech
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: hello-universe-db